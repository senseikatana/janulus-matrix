# Janulus Matrix — deploy en Netlify (Nuxt 4 SSR + pnpm monorepo)
# Nitro autodetecta el preset `netlify` cuando existe NETLIFY=true en el build.
[build]
  command = "pnpm install --frozen-lockfile && pnpm build:core && pnpm build"
  publish = ".output/public"

[build.environment]
  # Nitro 2.13 (preset netlify) usa Set.prototype.difference -> requiere Node 22+.
  NODE_VERSION = "22"
  # Netlify respeta `packageManager: pnpm@12.4.1` vía corepack.
  # Si el build falla con pnpm, setear en UI: NETLIFY_USE_PNPM="true".

# SSR + server routes (/api/translate) van por functions automáticamente.
# Sin redirects custom: routeRules de Nuxt ya manejan `/`.
