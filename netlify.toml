# Janulus Matrix — deploy en Netlify (Nuxt 4 SSR, npm).
# Nitro autodetecta el preset `netlify` cuando existe NETLIFY=true en el build.
[build]
  command = "npm ci && npm run build"
  publish = ".output/public"

[build.environment]
  # Nitro 2.13 (preset netlify) usa Set.prototype.difference -> requiere Node 22+.
  NODE_VERSION = "22"

# SSR + server routes (/api/translate) van por functions automáticamente.
# Sin redirects custom: routeRules de Nuxt ya manejan `/`.
