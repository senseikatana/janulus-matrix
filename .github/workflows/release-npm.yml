name: release-npm

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version bump (patch, minor, major or exact x.y.z)'
        required: true
        default: 'patch'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build and check package
        run: |
          pnpm --filter janulus-core build
          pnpm --dir packages/janulus-core pack
          pnpm dlx publint ./packages/janulus-core/janulus-core-*.tgz
          rm ./packages/janulus-core/janulus-core-*.tgz

      - name: Bump version
        run: pnpm --filter janulus-core version ${{ inputs.version }}

      - name: Publish with provenance
        run: pnpm --filter janulus-core publish --access public --provenance --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
