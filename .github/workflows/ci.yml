name: ci

on: push

jobs:
  ci:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]
        node: [22]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Pin npm 11
        # npm 10 (bundled con Node 22) rechaza `npm ci`: exige los optional
        # peers de @bomb.sh/tab (cac/commander) como nodos del lock.
        # Verificado: npm@10 ci falla, npm@11 ci pasa con el mismo árbol.
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Check deploy
        run: npm run check:deploy
